<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Products</title>
</head>

<body class="bg-gray-100">

    <main class="min-h-screen w-full">

        <section class="bg-gray-600 p-4 md:p-8 text-white">

            <h1 class="text-3xl font-bold text-center mb-8">
                Our Products
            </h1>


            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2
                       md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Products dynamically inserted here -->
            </div>

        </section>

    </main>


    <div id="product-modal" class="hidden fixed inset-0 z-50 bg-black/60
               items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Product details">


        <div class="bg-white text-gray-900 w-full max-w-3xl
                   max-h-[90vh] overflow-y-auto rounded-2xl
                   shadow-2xl relative p-6">


            <button id="close-modal" type="button" aria-label="Close product details" class="absolute top-3 right-4 z-10 text-3xl
                       text-gray-500 hover:text-red-500
                       cursor-pointer">
                &times;
            </button>


            <div id="modal-content" class="pt-6">

            </div>

        </div>

    </div>


    <script type="module" src="./js/index.js"></script>

</body>

</html>
